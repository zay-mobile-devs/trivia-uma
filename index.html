<style>
/* Layout: una columna tipo "hoja de turno" (máx. 680px). La tira de ECG es la protagonista: cada respuesta queda registrada como un latido. */
:root {
  --paper: #EDF1F4;
  --card: #FFFFFF;
  --ink: #14212C;
  --muted: #56687A;
  --line: #D2DBE2;
  --accent: #2347C9;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3E9FB;
  --amber: #9A5B00;
  --amber-soft: #FCEFD9;
  --ok: #157A4B;
  --ok-soft: #DFF2E8;
  --bad: #BF3328;
  --bad-soft: #FBE5E2;
  --ecg-paper: #FFF5F2;
  --grid-minor: rgba(222, 110, 98, .16);
  --grid-major: rgba(207, 82, 70, .34);
  --trace: #1A2531;
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D151C; --card: #152029; --ink: #E4EBF0; --muted: #93A3B0; --line: #283643;
    --accent: #84A0FF; --accent-ink: #0D151C; --accent-soft: #1C2A4D;
    --amber: #F0B44C; --amber-soft: #3A2B12;
    --ok: #52CD92; --ok-soft: #12301F; --bad: #FF7B6C; --bad-soft: #3A1A17;
    --ecg-paper: #1B1517; --grid-minor: rgba(255, 120, 110, .09); --grid-major: rgba(255, 120, 110, .2); --trace: #F3E9E6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0D151C; --card: #152029; --ink: #E4EBF0; --muted: #93A3B0; --line: #283643;
  --accent: #84A0FF; --accent-ink: #0D151C; --accent-soft: #1C2A4D;
  --amber: #F0B44C; --amber-soft: #3A2B12;
  --ok: #52CD92; --ok-soft: #12301F; --bad: #FF7B6C; --bad-soft: #3A1A17;
  --ecg-paper: #1B1517; --grid-minor: rgba(255, 120, 110, .09); --grid-major: rgba(255, 120, 110, .2); --trace: #F3E9E6;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.5;
}
.app {
  max-width: 680px;
  margin: 0 auto;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 24px;
}
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}
a { color: var(--accent); }

.eyebrow {
  font-family: var(--f-mono);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0;
}
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
.title {
  font-size: clamp(52px, 15vw, 88px);
  font-weight: 880;
  font-stretch: 125%;
  line-height: .88;
  letter-spacing: -.015em;
}
.title span { color: var(--accent); }
.lead { margin: 0; font-size: 18px; max-width: 58ch; color: var(--ink); }
.muted { color: var(--muted); }
.stack { display: grid; gap: 12px; }
.stack-lg { display: grid; gap: 20px; }

/* --- Tira de ECG --- */
.ecg {
  position: relative;
  height: 104px;
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  background-color: var(--ecg-paper);
  background-image:
    linear-gradient(var(--grid-major) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
    linear-gradient(var(--grid-minor) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-minor) 1px, transparent 1px);
  background-size: 40px 40px, 40px 40px, 8px 8px, 8px 8px;
  background-position: -1px -1px;
}
.ecg svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ecg path { fill: none; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.ecg .beat-ok, .ecg .beat-idle { stroke: var(--trace); }
.ecg .beat-bad { stroke: var(--bad); }
.ecg .beat-wait { stroke: var(--trace); opacity: .28; }
.ecg-label {
  position: absolute;
  top: 6px;
  font-family: var(--f-mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  background: var(--ecg-paper);
  padding: 0 4px;
  border-radius: 3px;
  z-index: 1;
}
.ecg-label.l { left: 8px; }
.ecg-label.r { right: 8px; }
.beat-idle { stroke-dasharray: 1; stroke-dashoffset: 1; animation: sweep 3.6s linear infinite; }
.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: drawin .7s ease-out forwards; }
@keyframes sweep { 0% { stroke-dashoffset: 1; } 85%, 100% { stroke-dashoffset: 0; } }
@keyframes drawin { to { stroke-dashoffset: 0; } }

/* --- Inicio --- */
.section-label {
  font-family: var(--f-display);
  font-size: 15px;
  font-weight: 700;
  font-stretch: 112%;
  letter-spacing: .02em;
  margin: 0;
}
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex;
  align-items: baseline;
  gap: 8px;
  padding: 8px 14px;
  border: 1.5px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  font-size: 15px;
  cursor: pointer;
}
.chip:hover { border-color: var(--accent); }
.chip .n { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.chip[aria-pressed="true"] .n { color: var(--paper); opacity: .75; }

.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 460px) { .modes { grid-template-columns: 1fr; } }
.mode {
  text-align: left;
  display: grid;
  gap: 2px;
  padding: 14px 16px;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  background: var(--card);
  cursor: pointer;
}
.mode:hover { border-color: var(--accent); }
.mode strong { font-family: var(--f-display); font-size: 19px; font-stretch: 112%; font-weight: 750; }
.mode span { font-size: 14px; color: var(--muted); }
.mode[aria-checked="true"] { border: 2px solid var(--accent); background: var(--accent-soft); padding: 13.5px 15.5px; }

.btn-primary {
  width: 100%;
  padding: 16px 20px;
  border: 0;
  border-radius: 12px;
  background: var(--accent);
  color: var(--accent-ink);
  font-family: var(--f-display);
  font-size: 20px;
  font-weight: 760;
  font-stretch: 115%;
  cursor: pointer;
}
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost {
  padding: 12px 18px;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  background: transparent;
  font-weight: 700;
  cursor: pointer;
}
.btn-ghost:hover { border-color: var(--accent); }
.btn-link {
  border: 0;
  background: none;
  padding: 4px 0;
  color: var(--muted);
  font-size: 14px;
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
}
.best { font-family: var(--f-mono); font-size: 13px; color: var(--muted); margin: 0; font-variant-numeric: tabular-nums; }

/* --- Juego --- */
.hud {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.hud-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.counter { font-family: var(--f-mono); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tag {
  font-size: 13px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
}
.hud-right { display: flex; align-items: center; gap: 10px; }
.streak {
  font-family: var(--f-mono);
  font-size: 13px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 999px;
  background: var(--amber-soft);
  color: var(--amber);
}
.score { font-family: var(--f-mono); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.score small { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 4px; }
.bump { animation: bump .45s ease-out; }
@keyframes bump { 40% { transform: scale(1.18); color: var(--ok); } }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 22px 20px;
  display: grid;
  gap: 18px;
}
.speed { display: grid; gap: 6px; }
.speed-track { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.speed-fill { height: 100%; width: 100%; background: var(--accent); border-radius: 99px; }
.speed-row { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.question {
  font-family: var(--f-body);
  font-size: clamp(20px, 5vw, 23px);
  font-weight: 700;
  line-height: 1.35;
  text-wrap: pretty;
  margin: 0;
}
.question:focus { outline: none; }
.options { display: grid; gap: 10px; }
.opt {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  width: 100%;
  text-align: left;
  padding: 13px 14px;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  background: var(--card);
  cursor: pointer;
  line-height: 1.4;
}
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt:disabled { cursor: default; }
.opt .key {
  flex: none;
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border: 1.5px solid var(--line);
  border-radius: 7px;
  font-family: var(--f-mono);
  font-size: 13px;
  font-weight: 600;
}
.opt .txt { min-width: 0; padding-top: 2px; }
.opt.is-correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.is-correct .key { background: var(--ok); border-color: var(--ok); color: var(--card); }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.is-wrong .key { background: var(--bad); border-color: var(--bad); color: var(--card); }
.opt.is-dim { opacity: .5; }

.feedback { display: grid; gap: 10px; padding-top: 4px; border-top: 1px dashed var(--line); }
.feedback[hidden] { display: none !important; }
.verdict { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-top: 12px; }
.verdict h3 { font-size: 24px; font-stretch: 115%; font-weight: 820; }
.verdict.ok h3 { color: var(--ok); }
.verdict.bad h3 { color: var(--bad); }
.verdict .pts { font-family: var(--f-mono); font-weight: 600; color: var(--ok); font-variant-numeric: tabular-nums; }
.explain { margin: 0; max-width: 62ch; }
.source { margin: 0; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }

/* --- Resultados --- */
.result-head { display: grid; gap: 6px; }
.rank { font-size: clamp(30px, 8vw, 44px); font-weight: 860; font-stretch: 118%; line-height: 1; color: var(--accent); }
.big-score { font-family: var(--f-mono); font-size: clamp(44px, 12vw, 64px); font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 15px; }
.stats b { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.record { display: inline-block; font-family: var(--f-mono); font-size: 13px; font-weight: 600; color: var(--amber); background: var(--amber-soft); padding: 3px 10px; border-radius: 999px; }
.actions { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
@media (max-width: 460px) { .actions { grid-template-columns: 1fr; } }
.review { display: grid; gap: 12px; padding: 0; margin: 0; list-style: none; }
.review li { padding: 14px 16px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); display: grid; gap: 6px; }
.review .q { font-weight: 700; margin: 0; }
.review .a { margin: 0; }
.review .a b { color: var(--ok); }
.perfect { margin: 0; padding: 14px 16px; border-radius: 12px; background: var(--ok-soft); color: var(--ok); font-weight: 700; }

.foot { border-top: 1px solid var(--line); padding-top: 16px; font-size: 14px; color: var(--muted); display: grid; gap: 6px; }
.foot p { margin: 0; max-width: 64ch; }
.foot .credit { display: grid; gap: 2px; padding-bottom: 6px; }
.foot .credit-team { font-family: var(--f-display); font-size: 18px; font-weight: 760; font-stretch: 112%; color: var(--ink); }
.foot .credit-names { color: var(--ink); }
.foot .legal { font-size: 13px; }
.foot .dev { font-family: var(--f-mono); font-size: 12px; letter-spacing: .04em; padding-top: 6px; }
.foot .dev strong { color: var(--ink); font-weight: 600; }
.byline { margin: 0; font-size: 15px; color: var(--muted); }
.byline b { color: var(--ink); }

@media (prefers-reduced-motion: reduce) {
  .beat-idle, .draw { animation: none; stroke-dasharray: none; stroke-dashoffset: 0; }
  .bump { animation: none; }
}
</style>

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function fmt(n) { return Number(n).toLocaleString('es-CL'); }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function opts(q) { return q.tf ? ['Verdadero', 'Falso'] : q.o; }
  function topicName(id) {
    for (var i = 0; i < TOPICS.length; i++) if (TOPICS[i].id === id) return TOPICS[i].name;
    return 'Todos los temas';
  }
  function pool(topic) {
    var ids = [];
    for (var i = 0; i < Q.length; i++) if (topic === 'all' || Q[i].t === topic) ids.push(i);
    return ids;
  }

  function loadBest() {
    try { return JSON.parse(localStorage.getItem('trivia-uma-best')) || {}; } catch (e) { return {}; }
  }
  function saveBest(b) {
    try { localStorage.setItem('trivia-uma-best', JSON.stringify(b)); } catch (e) { /* sin almacenamiento */ }
  }

  // --- Tira de ECG: cada latido ocupa 60 unidades de ancho, línea base en y = 50 ---
  function beatPath(x, kind) {
    var y = 50;
    function p(dx, dy) { return (x + dx).toFixed(1) + ',' + (y + dy).toFixed(1); }
    if (kind === 'ok' || kind === 'idle') {
      return 'M' + p(0, 0) + ' L' + p(12, 0) + ' Q' + p(15, -8) + ' ' + p(18, 0) + ' L' + p(22, 0) + ' L' + p(24, 4) +
        ' L' + p(27, -38) + ' L' + p(30, 15) + ' L' + p(33, 0) + ' L' + p(39, 0) + ' Q' + p(44, -11) + ' ' + p(49, 0) + ' L' + p(60, 0);
    }
    if (kind === 'bad') {
      return 'M' + p(0, 0) + ' L' + p(9, 0) + ' L' + p(12, -7) + ' L' + p(15, 6) + ' L' + p(18, -9) + ' L' + p(21, 7) +
        ' L' + p(24, -5) + ' L' + p(27, 8) + ' L' + p(30, -6) + ' L' + p(33, 4) + ' L' + p(36, -2) + ' L' + p(39, 0) + ' L' + p(60, 0);
    }
    return 'M' + p(0, 0) + ' L' + p(60, 0);
  }
  function stripSVG(beats, animateLast) {
    var w = beats.length * 60;
    var lastIdx = -1;
    beats.forEach(function (k, i) { if (k === 'ok' || k === 'bad') lastIdx = i; });
    var paths = beats.map(function (k, i) {
      var cls = k === 'ok' ? 'beat-ok' : k === 'bad' ? 'beat-bad' : k === 'idle' ? 'beat-idle' : 'beat-wait';
      if (animateLast && i === lastIdx) cls += ' draw';
      return '<path class="' + cls + '" pathLength="1" vector-effect="non-scaling-stroke" d="' + beatPath(i * 60, k) + '"></path>';
    }).join('');
    return '<svg viewBox="0 0 ' + w + ' 100" preserveAspectRatio="none" aria-hidden="true">' + paths + '</svg>';
  }
  function ecg(beats, animateLast, right) {
    return '<div class="ecg"><span class="ecg-label l">II</span><span class="ecg-label r">' + esc(right || '25 mm/s') + '</span>' + stripSVG(beats, animateLast) + '</div>';
  }
  function roundBeats() {
    var beats = state.results.map(function (r) { return r.ok ? 'ok' : 'bad'; });
    if (state.mode === 'turno') {
      while (beats.length < state.deck.length) beats.push('wait');
      return beats;
    }
    beats = beats.slice(-9);
    while (beats.length < 10) beats.push('wait');
    return beats;
  }

          '<button class="mode" type="button" role="radio" data-mode="racha" aria-checked="' + (state.mode === 'racha') + '"><strong>Racha</strong><span>Responde hasta tu primer error. ¿Cuántas seguidas logras?</span></button>' +
        '</div>' +
      '</section>' +
      '<div class="stack">' +
        '<button class="btn-primary" type="button" id="go">Comenzar turno</button>' +
        (bestLine.length ? '<p class="best">' + esc(bestLine.join(' · ')) + '</p>' : '') +
      '</div>' +
      footer();

    root.querySelectorAll('[data-topic]').forEach(function (b) {
      b.addEventListener('click', function () { state.topic = b.getAttribute('data-topic'); renderStart(); root.querySelector('[data-topic="' + state.topic + '"]').focus(); });
    });
    root.querySelectorAll('[data-mode]').forEach(function (b) {
      b.addEventListener('click', function () { state.mode = b.getAttribute('data-mode'); renderStart(); root.querySelector('[data-mode="' + state.mode + '"]').focus(); });
    });
    document.getElementById('go').addEventListener('click', startRound);
  }

  function footer() {
    return '<footer class="foot">' +
      '<div class="credit"><p class="eyebrow">Elaborado por</p>' +
        '<p class="credit-team">Internas de Enfermería UNAB</p>' +
        '<p class="credit-names">Judith Jara · Constanza Putlitz · Martina Santander</p></div>' +
      '<p>Preguntas basadas en el Material de orientación para Internos/as de Enfermería (UNAB · Hospital Carlos Van Buren / UMA). Es un complemento educativo: no reemplaza las indicaciones médicas, la supervisión ni los protocolos institucionales vigentes.</p>' +
      '<p><a href="' + MATERIAL_URL + '" target="_blank" rel="noopener">Ver el material completo</a></p>' +
      '<p class="legal">© 2026 Internas de Enfermería UNAB. Material educativo de uso interno. Prohibida su reproducción total o parcial sin autorización de las autoras.</p>' +
      '<p class="dev">Desarrollado por <strong>ZayDevs</strong></p>' +
      '</footer>';
  }

  function startRound() {
    var ids = shuffle(pool(state.topic));
    state.deck = state.mode === 'turno' ? ids.slice(0, ROUND) : ids;
    state.idx = 0;
    state.results = [];
    state.score = 0;
    state.streak = 0;
    state.answered = false;
    state.lastPts = 0;
    state.newRecord = false;
    state.screen = 'play';
    prepareQuestion();
    render();
  }

  function prepareQuestion() {
    var q = Q[state.deck[state.idx]];
    var idx = opts(q).map(function (_, i) { return i; });
    state.order = q.tf ? idx : shuffle(idx);
    state.answered = false;
  }

  function renderPlay(animateLast) {
    var qi = state.deck[state.idx];
    var q = Q[qi];
    var o = opts(q);
    var last = state.answered ? state.results[state.results.length - 1] : null;
    var total = state.mode === 'turno' ? ' / ' + state.deck.length : '';
    var isLast = state.mode === 'turno' ? state.idx >= state.deck.length - 1 : (last && !last.ok) || state.idx >= state.deck.length - 1;

    var optsHtml = state.order.map(function (oi, pos) {
      var cls = 'opt';
      if (last) {
        if (oi === q.a) cls += ' is-correct';
        else if (oi === last.chosen) cls += ' is-wrong';
        else cls += ' is-dim';
      }
      return '<button class="' + cls + '" type="button" data-choice="' + oi + '"' + (last ? ' disabled' : '') + '>' +
        '<span class="key">' + 'ABCD'.charAt(pos) + '</span><span class="txt">' + esc(o[oi]) + '</span></button>';
    }).join('');

    var fb = '';
    if (last) {
      fb = '<div class="verdict ' + (last.ok ? 'ok' : 'bad') + '"><h3>' + (last.ok ? '¡Correcto!' : 'Incorrecto') + '</h3>' +
        (last.ok ? '<span class="pts">+' + fmt(last.pts) + '</span>' : '') + '</div>' +
        (!last.ok ? '<p class="explain"><b>Respuesta correcta:</b> ' + esc(o[q.a]) + '</p>' : '') +
        (q.e ? '<p class="explain">' + esc(q.e) + '</p>' : '') +
        '<p class="source">Fuente · ' + esc(SRC[q.s]) + '</p>' +
        '<button class="btn-primary" type="button" id="next">' + (isLast ? 'Ver resultados' : 'Siguiente pregunta') + '</button>';
    }

    root.innerHTML =
      '<div class="hud">' +
        '<div class="hud-left"><span class="counter">Pregunta ' + (state.idx + 1) + total + '</span><span class="tag">' + esc(topicName(q.t)) + '</span></div>' +
        '<div class="hud-right">' + (state.streak >= 2 ? '<span class="streak">Racha ×' + state.streak + '</span>' : '') +
          '<span class="score" id="score">' + fmt(state.score) + '<small>pts</small></span></div>' +
      '</div>' +
      ecg(roundBeats(), animateLast, state.mode === 'turno' ? 'Turno' : 'Racha') +
      '<section class="card" aria-labelledby="qtext">' +
        '<div class="speed" aria-hidden="true"><div class="speed-track"><div class="speed-fill" id="speed"></div></div>' +
          '<div class="speed-row"><span>Bono de rapidez</span><span id="speedpts">+50</span></div></div>' +
        '<p class="question" id="qtext" tabindex="-1">' + esc(q.tf ? 'Verdadero o falso: ' + q.q : q.q) + '</p>' +
        '<div class="options">' + optsHtml + '</div>' +
        '<div class="feedback" role="status" aria-live="polite"' + (last ? '' : ' hidden') + '>' + fb + '</div>' +
      '</section>' +
      '<div><button class="btn-link" type="button" id="quit">Salir al inicio</button></div>';

    root.querySelectorAll('[data-choice]').forEach(function (b) {
      b.addEventListener('click', function () { answer(Number(b.getAttribute('data-choice'))); });
    });
    document.getElementById('quit').addEventListener('click', function () { state.screen = 'start'; render(); });
    var next = document.getElementById('next');
    if (next) {
      next.addEventListener('click', advance);
      next.focus();
      freezeSpeed(last.bonus);
      if (last.ok && animateLast) { var sc = document.getElementById('score'); sc.classList.add('bump'); }
    } else {
      runSpeed();
    }
  }

  var raf = 0;
  function runSpeed() {
    cancelAnimationFrame(raf);
    qStart = performance.now();
    var fill = document.getElementById('speed');
    var label = document.getElementById('speedpts');
    function tick(now) {
      if (state.screen !== 'play' || state.answered) return;
      var left = Math.max(0, 1 - (now - qStart) / SPEED_MS);
      fill.style.width = (left * 100).toFixed(2) + '%';
      label.textContent = '+' + Math.round(50 * left);
      if (left > 0) raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);
  }
  function freezeSpeed(bonus) {
    cancelAnimationFrame(raf);
    var fill = document.getElementById('speed');
    var label = document.getElementById('speedpts');
    if (fill) fill.style.width = (bonus / 50 * 100).toFixed(2) + '%';
    if (label) label.textContent = '+' + bonus;
  }

  function answer(choice) {
    if (state.answered) return;
    var q = Q[state.deck[state.idx]];
    var ok = choice === q.a;
    var bonus = Math.round(50 * Math.max(0, 1 - (performance.now() - qStart) / SPEED_MS));
    var pts = 0;
    if (ok) {
      state.streak += 1;
      pts = 100 + bonus + Math.min(50, 10 * (state.streak - 1));
      state.score += pts;
    } else {
      state.streak = 0;
      bonus = 0;
    }
    state.results.push({ id: state.deck[state.idx], chosen: choice, ok: ok, pts: pts, bonus: bonus });
    state.answered = true;
    renderPlay(true);
  }

  function advance() {
    var last = state.results[state.results.length - 1];
    var done = state.mode === 'turno' ? state.idx >= state.deck.length - 1 : !last.ok || state.idx >= state.deck.length - 1;
    if (done) { finish(); return; }
    state.idx += 1;
    prepareQuestion();
    renderPlay(false);
    document.getElementById('qtext').focus();
  }

  function finish() {
    var best = loadBest();
    if (state.mode === 'turno') {
      if (state.score > (best.turno || 0)) { best.turno = state.score; state.newRecord = state.score > 0; }
    } else {
      var run = correctCount();
      if (run > (best.racha || 0)) { best.racha = run; state.newRecord = run > 0; }
    }
    saveBest(best);
    state.screen = 'end';
    render();
  }

  function correctCount() {
    return state.results.filter(function (r) { return r.ok; }).length;
  }

  function renderEnd() {
    var n = state.results.length;
    var c = correctCount();
    var rank;
    if (state.mode === 'turno') {
      var pct = n ? c / n : 0;
      rank = RANKS.filter(function (r) { return pct >= r.min; })[0];
    } else {
      rank = STREAK_RANKS.filter(function (r) { return c >= r.min; })[0];
    }
    var missed = state.results.filter(function (r) { return !r.ok; });
    var allDone = state.mode === 'racha' && !missed.length;
    var statsHtml = state.mode === 'turno'
      ? '<span><b>' + c + '</b> de <b>' + n + '</b> correctas</span><span>Mejor racha del turno: <b>' + bestRun() + '</b></span>'
      : '<span>Racha: <b>' + c + '</b> seguidas</span><span>' + (allDone ? 'Respondiste todas las preguntas del tema' : 'Preguntas disponibles: <b>' + state.deck.length + '</b>') + '</span>';

    var review = missed.length
      ? '<section class="stack" aria-labelledby="lbl-rep"><h2 class="section-label" id="lbl-rep">Para repasar</h2><ul class="review">' +
        missed.map(function (r) {
          var q = Q[r.id];
          return '<li><p class="q">' + esc(q.tf ? 'Verdadero o falso: ' + q.q : q.q) + '</p>' +
            '<p class="a">Respuesta correcta: <b>' + esc(opts(q)[q.a]) + '</b></p>' +
            (q.e ? '<p class="a muted">' + esc(q.e) + '</p>' : '') +
            '<p class="source">' + esc(SRC[q.s]) + '</p></li>';
        }).join('') + '</ul></section>'
      : '<p class="perfect">Sin errores. Todas tus respuestas fueron correctas.</p>';

    root.innerHTML =
      '<header class="result-head">' +
        '<p class="eyebrow">Fin del turno · ' + esc(topicName(state.topic)) + '</p>' +
        '<h1 class="rank">' + esc(rank.name) + '</h1>' +
        '<p class="lead">' + esc(rank.msg) + '</p>' +
      '</header>' +
      '<div class="stack">' +
        '<div class="big-score">' + fmt(state.score) + ' <span class="eyebrow">puntos</span></div>' +
        '<div class="stats">' + statsHtml + '</div>' +
        (state.newRecord ? '<div><span class="record">Nuevo récord personal</span></div>' : '') +
      '</div>' +
      ecg(state.mode === 'turno' ? roundBeats() : roundBeats().filter(function (b) { return b !== 'wait'; }), false, c + ' / ' + n) +
      '<div class="actions"><button class="btn-primary" type="button" id="again">Jugar otra vez</button><button class="btn-ghost" type="button" id="home">Cambiar tema</button></div>' +
      review +
      footer();

    document.getElementById('again').addEventListener('click', startRound);
    document.getElementById('home').addEventListener('click', function () { state.screen = 'start'; render(); });
    document.getElementById('again').focus();
  }

  function bestRun() {
    var best = 0, cur = 0;
    state.results.forEach(function (r) { cur = r.ok ? cur + 1 : 0; if (cur > best) best = cur; });
    return best;
  }

  function render() {
    cancelAnimationFrame(raf);
    if (state.screen === 'play' && state.deck.length) renderPlay(false);
    else if (state.screen === 'end') renderEnd();
    else { state.screen = 'start'; renderStart(); }
    window.scrollTo(0, 0);
  }

  document.addEventListener('keydown', function (ev) {
    if (state.screen !== 'play' || ev.altKey || ev.ctrlKey || ev.metaKey) return;
    var k = ev.key.toLowerCase();
    if (!state.answered) {
      var pos = '1234'.indexOf(k) >= 0 ? '1234'.indexOf(k) : 'abcd'.indexOf(k);
      if (pos >= 0 && pos < state.order.length) { ev.preventDefault(); answer(state.order[pos]); }
    }
  });

  function start(data) {
    if (data && data.state && data.state.screen) {
      for (var key in data.state) if (Object.prototype.hasOwnProperty.call(state, key)) state[key] = data.state[key];
    }
    render();
  }
  var hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(function () { return { state: state }; });
  if (hot && hot.ready) hot.ready(start);
  else start((hot && hot.data) || {});
})();
</script>
</body>
</html>
